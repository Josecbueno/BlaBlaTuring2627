{% extends "base.html" %}
{% block content%}
<h1 class="title">Incidents</h1>
<table class="table">
    <thead>
        <th>ID</th>
        <th>Subject</th>
        <th>Sender</th>
    </thead>
    <tbody>
        {% for incident in object_list %}
        <tr>
            <td> <a href="{% url 'incident-detail' incident.id %}">{{ incident.id }}</a> </td>
            <td>{{ incident.subject }}</td>
            <td>{{ incident.sender }}</td>
        </tr>
        {% empty %}
            <td>No incidents yet. Thanks :)</td>
            {% endfor %}
    </tbody>
</table>
{% endblock %}
